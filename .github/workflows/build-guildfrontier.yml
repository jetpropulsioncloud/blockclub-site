name: Build Guild Frontier JAR for Paper 1.21

on:
  push:
    branches:
      - build/guildfrontier-0.4.0
    paths:
      - 'guildfrontier-build/**'
      - '.github/workflows/build-guildfrontier.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Restore Frontier source
        shell: bash
        run: |
          rm -rf guildfrontier-build/project
          mkdir -p guildfrontier-build/project
          cat guildfrontier-build/chunks/src.part* > /tmp/guildfrontier-src.zip.b64
          base64 -d /tmp/guildfrontier-src.zip.b64 > /tmp/guildfrontier-src.zip
          unzip -t /tmp/guildfrontier-src.zip
          unzip -q /tmp/guildfrontier-src.zip -d guildfrontier-build/project

      - name: Retarget and add visible red Frontier border
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('guildfrontier-build/project')
          build = root / 'build.gradle.kts'
          s = build.read_text()
          s = s.replace('version = "0.4.0"', 'version = "0.4.2"')
          s = s.replace('io.papermc.paper:paper-api:26.2.build.+', 'io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT')
          s = s.replace('JavaLanguageVersion.of(25)', 'JavaLanguageVersion.of(21)')
          s = s.replace('options.release.set(25)', 'options.release.set(21)')
          build.write_text(s)

          plugin = root / 'src/main/resources/plugin.yml'
          s = plugin.read_text().replace("version: '0.4.0'", "version: '0.4.2'").replace("api-version: '26.2'", "api-version: '1.21'")
          plugin.write_text(s)

          config = root / 'src/main/resources/config.yml'
          s = config.read_text()
          s = s.replace('  particle-points: 9\n  arc-degrees: 42', '  # Bright red client-side dust ribbon shown only near the border.\n  particle-points: 11\n  vertical-layers: 3\n  layer-spacing: 0.7\n  particle-size: 1.5\n  arc-degrees: 50')
          config.write_text(s)

          fm = root / 'src/main/java/com/blockclub/frontier/FrontierManager.java'
          s = fm.read_text()
          s = s.replace('import org.bukkit.Bukkit;\n', 'import org.bukkit.Bukkit;\nimport org.bukkit.Color;\n')
          start_marker = '        player.sendActionBar(Component.text(nearest.guild().displayName() + " boundary • "'
          end_marker = '\n    }\n\n    @EventHandler(priority = EventPriority.HIGH, ignoreCancelled = true)\n    public void onTeleport'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Boundary markers not found')
          new = '''        String boundaryState = inside ? "SAFE SIDE" : "PVP FRONTIER";
              player.sendActionBar(Component.text("⚠ " + nearest.guild().displayName() + " BORDER • "
                      + Math.max(0, Math.round(nearestGap)) + " blocks • " + boundaryState));

              int points = Math.max(3, Math.min(24, plugin.getConfig().getInt("boundary.particle-points", 11)));
              int layers = Math.max(1, Math.min(5, plugin.getConfig().getInt("boundary.vertical-layers", 3)));
              double layerSpacing = Math.max(0.25, Math.min(1.5, plugin.getConfig().getDouble("boundary.layer-spacing", 0.7)));
              float particleSize = (float) Math.max(0.5, Math.min(4.0, plugin.getConfig().getDouble("boundary.particle-size", 1.5)));
              double arcDegrees = Math.max(10.0, Math.min(120.0, plugin.getConfig().getDouble("boundary.arc-degrees", 50.0)));
              double centerAngle = Math.atan2(location.getZ() - nearest.centerZ(), location.getX() - nearest.centerX());
              double halfArc = Math.toRadians(arcDegrees) / 2.0;
              double baseY = location.getY() + 0.15;
              Particle.DustOptions redDust = new Particle.DustOptions(Color.fromRGB(220, 20, 20), particleSize);

              for (int i = 0; i < points; i++) {
                  double t = points == 1 ? 0.5 : i / (double) (points - 1);
                  double angle = centerAngle - halfArc + (t * halfArc * 2.0);
                  double x = nearest.centerX() + Math.cos(angle) * nearest.radius();
                  double z = nearest.centerZ() + Math.sin(angle) * nearest.radius();
                  for (int layer = 0; layer < layers; layer++) {
                      double y = baseY + (layer * layerSpacing);
                      player.spawnParticle(Particle.DUST, x, y, z, 1, 0.0, 0.0, 0.0, 0.0, redDust);
                  }
              }'''
          fm.write_text(s[:start] + new + s[end:])
          PY

      - name: Build plugin
        run: gradle -p guildfrontier-build/project clean build --stacktrace

      - name: Verify Java 21 and plugin metadata
        shell: bash
        run: |
          javap -verbose -classpath guildfrontier-build/project/build/libs/blockclub-guildfrontier-0.4.2.jar com.blockclub.frontier.GuildFrontierPlugin | grep 'major version: 65'
          unzip -p guildfrontier-build/project/build/libs/blockclub-guildfrontier-0.4.2.jar plugin.yml | grep "api-version: '1.21'"
          unzip -p guildfrontier-build/project/build/libs/blockclub-guildfrontier-0.4.2.jar plugin.yml | grep "version: '0.4.2'"

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p guildfrontier-build/artifact
          cp guildfrontier-build/project/build/libs/blockclub-guildfrontier-0.4.2.jar guildfrontier-build/artifact/BlockClubGuildFrontier-0.4.2-MC1.21.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlockClubGuildFrontier-0.4.2-MC1.21
          path: guildfrontier-build/artifact/BlockClubGuildFrontier-0.4.2-MC1.21.jar
          if-no-files-found: error
          retention-days: 1
