name: Build Guild Frontier JAR for Paper 1.21

on:
  push:
    branches:
      - build/guildfrontier-0.4.0
    paths:
      - 'guildfrontier-build/**'
      - '.github/workflows/build-guildfrontier.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Restore Frontier source
        shell: bash
        run: |
          rm -rf guildfrontier-build/project
          mkdir -p guildfrontier-build/project
          cat guildfrontier-build/chunks/src.part* > /tmp/guildfrontier-src.zip.b64
          base64 -d /tmp/guildfrontier-src.zip.b64 > /tmp/guildfrontier-src.zip
          unzip -t /tmp/guildfrontier-src.zip
          unzip -q /tmp/guildfrontier-src.zip -d guildfrontier-build/project

      - name: Apply 1.21 block-border patch
        run: python3 guildfrontier-build/patch-v043.py

      - name: Build plugin against real Paper API
        run: gradle -p guildfrontier-build/project clean build --stacktrace

      - name: Verify Java 21 and plugin metadata
        shell: bash
        run: |
          JAR=guildfrontier-build/project/build/libs/blockclub-guildfrontier-0.4.3.jar
          javap -verbose -classpath "$JAR" com.blockclub.frontier.GuildFrontierPlugin | grep 'major version: 65'
          unzip -p "$JAR" plugin.yml | grep "api-version: '1.21'"
          unzip -p "$JAR" plugin.yml | grep "version: '0.4.3'"
          unzip -p "$JAR" config.yml | grep 'ground-material: RED_CONCRETE'
          javap -p -classpath "$JAR" com.blockclub.frontier.FrontierManager | grep 'rebuildBoundaryMarkers'

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p guildfrontier-build/artifact
          cp guildfrontier-build/project/build/libs/blockclub-guildfrontier-0.4.3.jar guildfrontier-build/artifact/BlockClubGuildFrontier-0.4.3-MC1.21.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlockClubGuildFrontier-0.4.3-MC1.21
          path: guildfrontier-build/artifact/BlockClubGuildFrontier-0.4.3-MC1.21.jar
          if-no-files-found: error
          retention-days: 1
