name: Build Guild Frontier JAR for Paper 1.21

on:
  push:
    branches:
      - build/guildfrontier-0.4.0
    paths:
      - 'guildfrontier-build/**'
      - '.github/workflows/build-guildfrontier.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Restore Frontier source
        shell: bash
        run: |
          rm -rf guildfrontier-build/project
          mkdir -p guildfrontier-build/project
          cat guildfrontier-build/chunks/src.part* > /tmp/guildfrontier-src.zip.b64
          base64 -d /tmp/guildfrontier-src.zip.b64 > /tmp/guildfrontier-src.zip
          unzip -t /tmp/guildfrontier-src.zip
          unzip -q /tmp/guildfrontier-src.zip -d guildfrontier-build/project

      - name: Retarget source to Paper 1.21 / Java 21
        shell: bash
        run: |
          sed -i 's/version = "0.4.0"/version = "0.4.1"/' guildfrontier-build/project/build.gradle.kts
          sed -i 's/io.papermc.paper:paper-api:26.2.build.+/io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT/' guildfrontier-build/project/build.gradle.kts
          sed -i 's/JavaLanguageVersion.of(25)/JavaLanguageVersion.of(21)/' guildfrontier-build/project/build.gradle.kts
          sed -i 's/options.release.set(25)/options.release.set(21)/' guildfrontier-build/project/build.gradle.kts
          sed -i "s/version: '0.4.0'/version: '0.4.1'/" guildfrontier-build/project/src/main/resources/plugin.yml
          sed -i "s/api-version: '26.2'/api-version: '1.21'/" guildfrontier-build/project/src/main/resources/plugin.yml
          cat guildfrontier-build/project/build.gradle.kts
          cat guildfrontier-build/project/src/main/resources/plugin.yml

      - name: Build plugin
        run: gradle -p guildfrontier-build/project clean build --stacktrace

      - name: Verify Java 21 and plugin metadata
        shell: bash
        run: |
          javap -verbose -classpath guildfrontier-build/project/build/libs/blockclub-guildfrontier-0.4.1.jar com.blockclub.frontier.GuildFrontierPlugin | grep 'major version: 65'
          unzip -p guildfrontier-build/project/build/libs/blockclub-guildfrontier-0.4.1.jar plugin.yml | grep "api-version: '1.21'"
          unzip -p guildfrontier-build/project/build/libs/blockclub-guildfrontier-0.4.1.jar plugin.yml | grep "version: '0.4.1'"

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p guildfrontier-build/artifact
          cp guildfrontier-build/project/build/libs/blockclub-guildfrontier-0.4.1.jar guildfrontier-build/artifact/BlockClubGuildFrontier-0.4.1-MC1.21.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlockClubGuildFrontier-0.4.1-MC1.21
          path: guildfrontier-build/artifact/BlockClubGuildFrontier-0.4.1-MC1.21.jar
          if-no-files-found: error
          retention-days: 1
