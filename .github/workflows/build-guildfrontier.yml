name: Build Guild Frontier JAR

on:
  push:
    branches:
      - build/guildfrontier-0.4.0
    paths:
      - 'guildfrontier-build/**'
      - '.github/workflows/build-guildfrontier.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Restore Frontier source
        shell: bash
        run: |
          rm -rf guildfrontier-build/project
          mkdir -p guildfrontier-build/project
          cat guildfrontier-build/chunks/src.part* > /tmp/guildfrontier-src.zip.b64
          base64 -d /tmp/guildfrontier-src.zip.b64 > /tmp/guildfrontier-src.zip
          unzip -t /tmp/guildfrontier-src.zip
          unzip -q /tmp/guildfrontier-src.zip -d guildfrontier-build/project

      - name: Build plugin
        run: gradle -p guildfrontier-build/project clean build --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p guildfrontier-build/artifact
          cp guildfrontier-build/project/build/libs/blockclub-guildfrontier-0.4.0.jar guildfrontier-build/artifact/BlockClubGuildFrontier-0.4.0.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlockClubGuildFrontier-0.4.0
          path: guildfrontier-build/artifact/BlockClubGuildFrontier-0.4.0.jar
          if-no-files-found: error
          retention-days: 1
