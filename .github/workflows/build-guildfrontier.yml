name: Build Guild Frontier 0.4.4 for Paper 1.21

on:
  push:
    branches:
      - build/guildfrontier-0.4.0
    paths:
      - 'guildfrontier-build/v044/**'
      - '.github/workflows/build-guildfrontier.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Restore verified 0.4.4 source
        shell: bash
        run: |
          rm -rf guildfrontier-build/project
          mkdir -p guildfrontier-build/project
          cat guildfrontier-build/v044/src.part* > /tmp/guildfrontier-v044.zip.b64
          base64 -d /tmp/guildfrontier-v044.zip.b64 > /tmp/guildfrontier-v044.zip
          unzip -t /tmp/guildfrontier-v044.zip
          unzip -q /tmp/guildfrontier-v044.zip -d guildfrontier-build/project

      - name: Build against real Paper 1.21 API
        run: gradle -p guildfrontier-build/project clean build --stacktrace

      - name: Verify safety, diplomacy, persistence, and metadata
        shell: bash
        run: |
          JAR=guildfrontier-build/project/build/libs/blockclub-guildfrontier-0.4.4.jar
          javap -verbose -classpath "$JAR" com.blockclub.frontier.GuildFrontierPlugin | grep 'major version: 65'
          unzip -p "$JAR" plugin.yml | grep "api-version: '1.21'"
          unzip -p "$JAR" plugin.yml | grep "version: '0.4.4'"
          unzip -p "$JAR" config.yml | grep 'search-radius: 18'
          unzip -p "$JAR" config.yml | grep 'gkp-plugin-name: BlockClubGKP'
          javap -p -classpath "$JAR" com.blockclub.frontier.FrontierManager | grep 'safeCampDestination'
          javap -p -classpath "$JAR" com.blockclub.frontier.FrontierManager | grep 'onBoundaryBreak'
          javap -p -classpath "$JAR" com.blockclub.frontier.FrontierManager | grep 'territoryProtectsPair'
          javap -p -classpath "$JAR" com.blockclub.frontier.BoundaryStore >/dev/null
          javap -p -classpath "$JAR" com.blockclub.frontier.GkpBridge >/dev/null

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p guildfrontier-build/artifact
          cp guildfrontier-build/project/build/libs/blockclub-guildfrontier-0.4.4.jar guildfrontier-build/artifact/BlockClubGuildFrontier-0.4.4-MC1.21.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlockClubGuildFrontier-0.4.4-MC1.21
          path: guildfrontier-build/artifact/BlockClubGuildFrontier-0.4.4-MC1.21.jar
          if-no-files-found: error
          retention-days: 1
