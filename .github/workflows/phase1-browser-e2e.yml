name: Phase 1 browser emulator smoke

on:
  push:
    branches:
      - 'fix/**'
  pull_request:

jobs:
  browser-emulators:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned test-only tools (do not update repository lockfile)
        run: npm install --no-save --package-lock=false playwright@1.58.2 firebase-tools@14.26.0
      - name: Install browser for integration smoke test
        run: npx playwright install --with-deps chromium
      - name: Run isolated demo-project Firebase emulator browser smoke test
        run: |
          npx firebase emulators:exec \
            --project demo-blockclub-e2e \
            --config .firebase-e2e.json \
            --only auth,firestore,storage,hosting \
            "node tests/browser-e2e.cjs"
